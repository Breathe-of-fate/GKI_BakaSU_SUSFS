name: Kernel build - Android 14 (6.1)

# 适配 Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # KernelSU 变体固定为 BakaSU
      kernelsu_branch:
        description: "KSU branch (main/builtin/[custom commit hash] - Leave blank to use the default)"
        required: false
        type: string
        default: ""
      clean_build:
        description: "Clean build (excluding KernelSU, SUSFS, and optional patches)"
        required: false
        type: boolean
        default: false
      version:
        description: "Version name (optional)"
        required: false
        type: string
      build_time:
        description: "Build time (optional; N or leave blank = current UTC)"
        required: false
        type: string
        default: ""
      use_zram:
        description: "Enable ZRAM enhancement algorithms"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "Enable BBG anti-crash protection"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "Enable Re-Kernel driver"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "Apply the CVE-2026-43499 rtmutex fix chain"
        required: false
        type: boolean
        default: true
      cancel_susfs:
        description: "Disable SUSFS"
        required: true
        type: boolean
        default: false
      supp_op:
        description: "Enable OnePlus 8E support"
        required: false
        type: boolean
        default: false
      droidspaces:
        description: "Droidspaces Container Support"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      droidspaces_ntsync:
        description: "Enable Droidspaces container NTSync support (requires Droidspaces to be enabled)"
        required: false
        type: boolean
        default: false
      build_bypass:
        description: "Build the standard kernel and the bypass kernel"
        required: false
        type: boolean
        default: false
      use_nomount:
        description: "Enable the NoMount mount meta-module (requires supporting modules)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      clean_build:
        required: false
        type: boolean
        default: false
      # The KernelSU variant is fixed as BakaSU.
      kernelsu_branch:
        required: true
        type: string
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: ""
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_rekernel:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: true
      cancel_susfs:
        required: false
        type: boolean
      supp_op:
        required: false
        type: boolean
      droidspaces:
        required: false
        type: string
        default: "off"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      build_bypass:
        required: false
        type: boolean
        default: false
      use_nomount:
        required: false
        type: boolean
        default: false

jobs:
  prepare-matrix:
    uses: ./.github/workflows/prepare-matrix.yml
    with:
      data_file: data/android14/6.1.json
      deduplicate_sublevels: true

  build-kernels-a14-6-1:
    needs: prepare-matrix
    name: "${{ matrix.kernel_version }}.${{ matrix.sub_level }}-${{ matrix.android_version }}-${{ matrix.os_patch_level }}"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs['prepare-matrix'].outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      clean_build: ${{ inputs.clean_build }}
      android_version: ${{ matrix.android_version }}
      kernel_version: ${{ matrix.kernel_version }}
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      revision: ${{ matrix.revision || '' }}
      ksu_variant: ${{ inputs.clean_build && 'Clean' || 'BakaSU' }}
      ksu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ !inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      build_bypass: ${{ inputs.build_bypass || false }}
